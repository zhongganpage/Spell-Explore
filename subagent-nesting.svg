<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowSpawn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5597"/>
    </marker>
    <marker id="arrowResult" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#1f3864">Nested sub-agent spawning in Kimi Code — how a sub-agent opens a sub-agent</text>

  <!-- spawn arrows (down) -->
  <g stroke="#2f5597" stroke-width="1.6" fill="none">
    <path d="M 640 83 L 640 172" marker-end="url(#arrowSpawn)"/>
    <path d="M 640 228 L 640 317" marker-end="url(#arrowSpawn)"/>
  </g>
  <!-- result arrows (up) -->
  <g stroke="#2e7d32" stroke-width="1.6" fill="none">
    <path d="M 770 345 L 770 228" marker-end="url(#arrowResult)"/>
    <path d="M 770 172 L 770 83" marker-end="url(#arrowResult)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#666">
    <text x="650" y="128" text-anchor="start">Agent tool call — prompt + description</text>
    <text x="650" y="273" text-anchor="start">Agent tool call — nested spawn, same mechanics</text>
    <text x="782" y="288" text-anchor="start">final result — lands in the</text>
    <text x="782" y="303" text-anchor="start">parent's context</text>
    <text x="782" y="128" text-anchor="start">final result — only this</text>
    <text x="782" y="143" text-anchor="start">enters the main context</text>
  </g>

  <!-- chain boxes -->
  <g>
    <rect x="450" y="27" width="380" height="56" rx="8" fill="#1f3864"/>
    <text x="640" y="49" text-anchor="middle" font-size="13" fill="#fff">Main Agent</text>
    <text x="640" y="67" text-anchor="middle" font-size="12" fill="#dce6f2">full context · all tools · source of permission rules</text>

    <rect x="450" y="172" width="380" height="56" rx="8" fill="#2f5597"/>
    <text x="640" y="194" text-anchor="middle" font-size="13" fill="#fff">Sub-agent (coder-type)</text>
    <text x="640" y="212" text-anchor="middle" font-size="12" fill="#dce6f2">isolated context — only the task description, never the parent's history</text>

    <rect x="450" y="317" width="380" height="56" rx="8" fill="#2e75b6"/>
    <text x="640" y="339" text-anchor="middle" font-size="13" fill="#fff">Nested sub-agent (recursive, any depth)</text>
    <text x="640" y="357" text-anchor="middle" font-size="12" fill="#e3ecf7">isolated context — the same rule at every level</text>
  </g>

  <!-- side annotations -->
  <g>
    <rect x="40" y="120" width="320" height="160" rx="8" fill="#eef2f8"/>
    <text x="55" y="142" font-size="13" font-weight="bold" fill="#1f3864">Context isolation (per level)</text>
    <text x="55" y="164" font-size="12" fill="#333">each level sees only the task description</text>
    <text x="55" y="180" font-size="12" fill="#333">passed to it — never the parent's history</text>
    <text x="55" y="196" font-size="12" fill="#333">intermediate reasoning never flows up; a</text>
    <text x="55" y="212" font-size="12" fill="#333">grandchild's result lands in its parent's</text>
    <text x="55" y="228" font-size="12" fill="#333">context, not the main agent's</text>

    <rect x="900" y="120" width="340" height="160" rx="8" fill="#eef2f8"/>
    <text x="915" y="142" font-size="13" font-weight="bold" fill="#1f3864">Permissions inherit down</text>
    <text x="915" y="164" font-size="12" fill="#333">allow rules propagate from the main agent to</text>
    <text x="915" y="180" font-size="12" fill="#333">every depth; the subagents allowlist restricts</text>
    <text x="915" y="196" font-size="12" fill="#333">which agent types an agent may spawn; a tool</text>
    <text x="915" y="212" font-size="12" fill="#333">disabled on the main agent is unavailable</text>
    <text x="915" y="228" font-size="12" fill="#333">below it</text>
  </g>

  <!-- bottom info grid -->
  <g>
    <rect x="40" y="490" width="380" height="70" rx="8" fill="#f2f2f2"/>
    <text x="55" y="508" font-size="12.5" font-weight="bold" fill="#333">Background &amp; auto-return</text>
    <text x="55" y="526" font-size="12" fill="#555">nested spawns can run in background;</text>
    <text x="55" y="542" font-size="12" fill="#555">results auto-delivered to the parent</text>

    <rect x="460" y="490" width="380" height="70" rx="8" fill="#f2f2f2"/>
    <text x="475" y="508" font-size="12.5" font-weight="bold" fill="#333">Resume by ID</text>
    <text x="475" y="526" font-size="12" fill="#555">each instance persists in the session's agents/</text>
    <text x="475" y="542" font-size="12" fill="#555">(wire.jsonl); resume keeps its context</text>

    <rect x="880" y="490" width="360" height="70" rx="8" fill="#f2f2f2"/>
    <text x="895" y="508" font-size="12.5" font-weight="bold" fill="#333">Per-instance timeout</text>
    <text x="895" y="526" font-size="12" fill="#555">[subagent] timeout_ms (2 h default) applies to</text>
    <text x="895" y="542" font-size="12" fill="#555">each level; a runaway grandchild times out alone</text>

    <rect x="40" y="580" width="380" height="70" rx="8" fill="#f2f2f2"/>
    <text x="55" y="598" font-size="12.5" font-weight="bold" fill="#333">Approval per dispatch</text>
    <text x="55" y="616" font-size="12" fill="#555">each spawn is an approval prompt unless</text>
    <text x="55" y="632" font-size="12" fill="#555">covered by an allow rule or YOLO mode</text>

    <rect x="460" y="580" width="380" height="70" rx="8" fill="#f2f2f2"/>
    <text x="475" y="598" font-size="12.5" font-weight="bold" fill="#333">Custom-agent handoff</text>
    <text x="475" y="616" font-size="12" fill="#555">built-ins: "final message = full handoff";</text>
    <text x="475" y="632" font-size="12" fill="#555">custom agents must state it in their body</text>

    <rect x="880" y="580" width="360" height="70" rx="8" fill="#f2f2f2"/>
    <text x="895" y="598" font-size="12.5" font-weight="bold" fill="#333">Cost compounds with depth</text>
    <text x="895" y="616" font-size="12" fill="#555">every level consumes its own tokens —</text>
    <text x="895" y="632" font-size="12" fill="#555">use the secondary model for low-stakes roles</text>
  </g>

  <text x="40" y="690" font-size="12" fill="#666">…and so on recursively — the docs give no nesting-depth cap: a coder-type sub-agent "can dispatch its own nested sub-agents when a task decomposes naturally" (blue = spawn down · green = result up).</text>
</svg>
