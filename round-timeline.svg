<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="17" font-weight="bold" fill="#1f3864">Spell-Explore round timeline — 2h18 budget (138 min) · one route critical path · scale 10 px/min</text>

  <!-- critical path bars -->
  <g>
    <rect x="60" y="70" width="200" height="44" rx="6" fill="#dbe5f1" stroke="#2f5597" stroke-width="1.5"/>
    <text x="160" y="90" text-anchor="middle" font-size="12.5" fill="#222">Creator phase 1</text>
    <text x="160" y="105" text-anchor="middle" font-size="11" fill="#555">0–20 · think ≤10 + summaries ≤10</text>

    <rect x="260" y="130" width="250" height="44" rx="6" fill="#e2f0d9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="385" y="150" text-anchor="middle" font-size="12.5" fill="#222">Producer report worker</text>
    <text x="385" y="165" text-anchor="middle" font-size="11" fill="#555">20–45 · two fresh summaries → idea report (25)</text>

    <rect x="510" y="190" width="130" height="44" rx="6" fill="#e6e6e6" stroke="#666" stroke-width="1.5"/>
    <text x="575" y="210" text-anchor="middle" font-size="12.5" fill="#222">linter +</text>
    <text x="575" y="225" text-anchor="middle" font-size="12.5" fill="#222">examine</text>

    <rect x="640" y="250" width="400" height="64" rx="6" fill="#fbe5d6" stroke="#c55a11" stroke-width="1.5"/>
    <rect x="648" y="258" width="142" height="18" rx="4" fill="#f7c9a8"/>
    <text x="719" y="271" text-anchor="middle" font-size="11" fill="#333">A: evidence list (63–78)</text>
    <rect x="648" y="280" width="292" height="18" rx="4" fill="#fbe5d6"/>
    <text x="794" y="293" text-anchor="middle" font-size="11" fill="#333">B/C/D: review (63–93)</text>
    <rect x="948" y="258" width="84" height="18" rx="4" fill="#f4b183"/>
    <text x="990" y="271" text-anchor="middle" font-size="11" fill="#333">exchange</text>
    <text x="840" y="306" text-anchor="middle" font-size="11.5" fill="#c55a11">panel 63–103 (40) · canary gate</text>

    <rect x="1040" y="330" width="150" height="44" rx="6" fill="#fbe5d6" stroke="#c55a11" stroke-width="1.5"/>
    <text x="1115" y="350" text-anchor="middle" font-size="12.5" fill="#222">PI rebuts +</text>
    <text x="1115" y="365" text-anchor="middle" font-size="12.5" fill="#222">change list</text>
    <line x1="640" y1="380" x2="1190" y2="380" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="1198" y="384" font-size="11" fill="#8a8a8a">promoter (parallel)</text>

    <rect x="1190" y="390" width="200" height="44" rx="6" fill="#fbe5d6" stroke="#c55a11" stroke-width="1.5"/>
    <text x="1290" y="410" text-anchor="middle" font-size="12.5" fill="#222">swarm ≥2/3</text>
    <text x="1290" y="425" text-anchor="middle" font-size="11" fill="#555">118–138 (20) · swarm + resumed BCD</text>
  </g>

  <!-- lane labels -->
  <g font-size="12" fill="#444">
    <text x="10" y="96" text-anchor="start">Creator</text>
    <text x="10" y="156" text-anchor="start">Producer</text>
    <text x="10" y="216" text-anchor="start">linter+examine</text>
    <text x="10" y="286" text-anchor="start">Selector panel</text>
    <text x="10" y="356" text-anchor="start">PI rebuttal</text>
    <text x="10" y="416" text-anchor="start">Swarm</text>
    <text x="10" y="482" text-anchor="start">Creator phase 2 (bg)</text>
    <text x="10" y="532" text-anchor="start">Formalizer (bg)</text>
    <text x="10" y="582" text-anchor="start">extra reports (bg)</text>
  </g>

  <!-- background lanes -->
  <g>
    <rect x="510" y="464" width="450" height="36" rx="6" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="735" y="487" text-anchor="middle" font-size="11" fill="#666">triggered by stale material · ≤15 min work · never on the critical path</text>

    <rect x="60" y="514" width="1380" height="36" rx="6" fill="none" stroke="#6a329f" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="660" y="537" text-anchor="middle" font-size="11" fill="#6a329f">no overall budget · runs across rounds · round close never cuts it</text>
    <line x1="1390" y1="532" x2="1420" y2="532" stroke="#6a329f" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowEnd)"/>

    <rect x="260" y="564" width="250" height="36" rx="6" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="385" y="587" text-anchor="middle" font-size="11" fill="#666">second reports can run here (parallel)</text>
  </g>

  <!-- time axis -->
  <g>
    <line x1="60" y1="620" x2="1390" y2="620" stroke="#555" stroke-width="1.5"/>
    <g stroke="#555" stroke-width="1">
      <line x1="60" y1="614" x2="60" y2="626"/>
      <line x1="260" y1="614" x2="260" y2="626"/>
      <line x1="460" y1="614" x2="460" y2="626"/>
      <line x1="660" y1="614" x2="660" y2="626"/>
      <line x1="860" y1="614" x2="860" y2="626"/>
      <line x1="1060" y1="614" x2="1060" y2="626"/>
      <line x1="1260" y1="614" x2="1260" y2="626"/>
      <line x1="1390" y1="614" x2="1390" y2="626"/>
    </g>
    <g font-size="12" fill="#555">
      <text x="60" y="642" text-anchor="middle">0</text>
      <text x="260" y="642" text-anchor="middle">20</text>
      <text x="460" y="642" text-anchor="middle">40</text>
      <text x="660" y="642" text-anchor="middle">60</text>
      <text x="860" y="642" text-anchor="middle">80</text>
      <text x="1060" y="642" text-anchor="middle">100</text>
      <text x="1260" y="642" text-anchor="middle">120</text>
      <text x="1390" y="642" text-anchor="middle">138 min</text>
    </g>
  </g>

  <!-- warnings -->
  <g>
    <circle cx="566" cy="182" r="7" fill="#c00000"/>
    <text x="566" y="186" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">!</text>
    <text x="580" y="180" font-size="11" fill="#c00000">linter failure → stale · the round produces no route</text>

    <circle cx="1296" cy="382" r="7" fill="#c00000"/>
    <text x="1296" y="386" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">!</text>
    <text x="1306" y="380" font-size="11" fill="#c00000">route 3 needs its own review — queues to next round</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#666">
    <rect x="20" y="656" width="1400" height="34" rx="6" fill="#f7f7f7"/>
    <text x="35" y="677">solid bars = critical path (sums to 138 min exactly) · dashed gray = background lanes (off critical path) · dashed purple = Formalizer (across rounds, unbound) · red ! = failure / capacity notes</text>
  </g>
</svg>
