# Spell-Explore — protocol configuration.
# Scaffolded per construction-plan §5 (build order, step 1: scaffolding) and
# consistent with planning-ideas-no-push.md (the spec is authoritative).
#
# this file holds only real Kimi Code config keys. the invented
# [round] budget_ms, [subagent.timeouts.*] and [subagent.timeline] tables are
# not Kimi Code config keys and are deleted; the binding per-phase budgets of
# the 138-minute round now live in rules/timekeeping.md and are enforced
# operationally by the Coordinator via TaskStop — not by the config.
#
# Round budget: 2 hours and 18 minutes (138 minutes) per round in rounds 1–2;
# rounds ≥ 3 run 139 minutes — the Producer's phase-2 writer spends 1 minute choosing
# its summary at the round's 20-min mark (rules/core-loop.md §2.2), and the windows after
# the choice shift +1 (21–46, 46–64, 64–104, 104–119, 119–139). the round-1
# setup — the Coordinator asking the user for the rough idea and writing it into
# the locked goal file (goal.md) — happens before the round clock starts and is
# not counted in the budget.
#
# Acceptance: a route is accepted iff at least 2/3 of the swarm workers AND at
# least 2/3 of the BCD reviewers agree. Milestone: all 3 swarm workers and all 3
# BCD reviewers accept (3/3 + 3/3) and the accepted routes together achieve the
# locked goal — operationally, the goal node of the Integrator's report reachable from the established base — kernel axioms + Mathlib theorems + [Formalized] pieces — with `#print axioms goalTheorem` clean of non-kernel axioms — then the Coordinator writes the manuscript (lock this name), the
# report about the project in PDF.
#
# The subcoordinators, the PIs, and the lean code runner are resumable: each
# runs its phase to completion in one run and is resumed by the Coordinator for
# its next phase, so no runtime timeout applies to them; every other worker
# closes once its job is done. all subcoordinators and workers run in the
# background — every subagent is spawned in the explicit background mode, never
# the blocking foreground.

[background]
max_running_tasks = 50    # cap for simultaneous background agents

[subagent]
# the runtime default subagent timeout is 2 h (7200000 ms), shorter than the
# 138-minute round, so long-lived roles (subcoordinators, PIs, lean code runner)
# would be force-killed as timed_out mid-round; with 0 there is no runtime
# timeout and the phase windows are enforced operationally by the Coordinator
# via TaskStop (see rules/timekeeping.md).
timeout_ms = 0

[secondary_model]
# secondary-model routing (model_preference: secondary on worker profiles) only
# takes effect when KIMI_CODE_EXPERIMENTAL_SECONDARY_MODEL=1 (or the master flag)
# is set in the environment, and the alias must exist in the live config's
# [models]; the secondary model is the cheap worker tier (idea workers, report
# workers, working swarm). the panel's external reviewer (workerD) does not use
# this routing — it is the exterior reviewer X, configured once at round 1 and
# invoked through a provider API or the local Codex CLI (modules/providers.md).
model = "moonshot-cn/kimi-k2.6"
